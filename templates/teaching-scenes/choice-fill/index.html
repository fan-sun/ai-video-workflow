<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>choice-fill</title><style>
@font-face{font-family:Noto;src:url('fonts/NotoSansSC-400.woff2');font-weight:400;font-display:block}
@font-face{font-family:Noto;src:url('fonts/NotoSansSC-700.woff2');font-weight:700;font-display:block}
*{box-sizing:border-box}html,body,#root{margin:0;width:1080px;height:1440px;overflow:hidden}
body{background:#102037;color:#eaf4f6;font-family:Noto,sans-serif}
#root{position:relative;background:linear-gradient(#ffffff09 1px,transparent 1px),linear-gradient(90deg,#ffffff09 1px,transparent 1px);background-size:48px 48px}
.stage{position:absolute;left:70px;top:400px;display:block;width:940px;height:640px;overflow:visible}
.wire{fill:none;stroke:#8bd6cf;stroke-width:5;stroke-linecap:round;stroke-linejoin:round}.dimwire{fill:none;stroke:#52717d;stroke-width:3;stroke-linecap:round}.amber{stroke:#ffbf57}
.panel{fill:#173652;stroke:#8bd6cf;stroke-width:3}.warm{fill:#3a3040;stroke:#ffbf57;stroke-width:3}.mintfill{fill:#8bd6cf}.goldfill{fill:#ffbf57}
svg text{font-family:Noto,sans-serif;fill:#eaf4f6;font-size:29px;font-weight:700}.small{font-size:23px;font-weight:400;fill:#c6d8e2}.choice-text,#result-prefix,#selected-content text{font-size:43px}.choice-text{fill:#a7c4cf}
#selected-content{color:#eaf4f6}#selected-content text{fill:currentColor}#moving-card{opacity:0}#next-slot,#result-hint{opacity:0}
</style></head><body>
<main id="root" data-composition-id="main" data-start="0" data-duration="2.8" data-width="1080" data-height="1440">
 <svg class="stage" viewBox="0 0 940 640" aria-label="从候选中选出一个对象，连续移动并填入结果槽">
  <g id="model-network"><rect x="345" y="90" width="234" height="273" rx="24" class="panel"/><path d="M384 151 460 127 539 177 461 233 385 293 462 325 539 283M384 151 461 233 539 283M385 293 460 127" class="dimwire"/><circle cx="384" cy="151" r="14" class="mintfill"/><circle cx="460" cy="127" r="14" class="mintfill"/><circle cx="539" cy="177" r="14" class="goldfill"/><circle cx="461" cy="233" r="17" class="goldfill"/><circle cx="385" cy="293" r="14" class="mintfill"/><circle cx="462" cy="325" r="14" class="mintfill"/><circle cx="539" cy="283" r="14" class="mintfill"/><text id="processor-label" x="462" y="411" text-anchor="middle">语言模型</text></g>
  <g id="prefix"><text id="source-label" x="35" y="146" class="small">已有的前文</text><rect x="28" y="176" width="250" height="93" rx="7" class="panel"/><text id="source-text" x="153" y="234" text-anchor="middle">天空很</text></g>
  <path d="M279 223H327m-14-12 14 12-14 12" class="wire"/>
  <text id="candidates-label" x="683" y="78" class="small">下一个词的候选</text>
  <rect id="source-slot" x="668" y="107" width="207" height="88" rx="6" class="warm"/>
  <g id="candidate2"><rect x="668" y="202" width="207" height="88" rx="6" class="panel"/><g id="candidate2-content" transform="translate(772 256)"><text x="0" y="0" text-anchor="middle" class="choice-text">高</text></g></g>
  <g id="candidate3"><rect x="668" y="297" width="207" height="88" rx="6" class="panel"/><g id="candidate3-content" transform="translate(772 351)"><text x="0" y="0" text-anchor="middle" class="choice-text">美</text></g></g>
  <path d="M580 224h32v-76h40m-14-12 14 12-14 12" class="wire amber"/>
  <g id="result-area"><path d="M190 490H750" class="dimwire"/><text id="result-prefix" x="500" y="557" text-anchor="end">天空很</text><rect id="result-slot" x="499" y="502" width="72" height="80" rx="5" fill="none" stroke="#8bd6cf" stroke-width="3" stroke-dasharray="7 7"/><path id="next-slot" d="M592 568h77" class="wire amber"/><text id="result-hint" x="469" y="625" text-anchor="middle" class="small">根据前文，继续生成</text></g>
  <g id="selected-object" transform="translate(772 161)"><g id="moving-card"><rect x="-97.5" y="-55" width="195" height="80" rx="5" class="goldfill"/></g><g id="selected-content"><text x="0" y="0" text-anchor="middle">蓝</text></g></g>
 </svg>
</main>
<script src="gsap.min.js"></script><script src="settings.js"></script><script src="timeline.js"></script><script>window.__timelines={};window.__timelines.main=tl;</script>
</body></html>

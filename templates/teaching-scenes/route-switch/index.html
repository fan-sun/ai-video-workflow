<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>route-switch</title><style>
@font-face{font-family:Course;src:url('fonts/NotoSansSC-400.woff2');font-weight:400;font-display:block}
@font-face{font-family:Course;src:url('fonts/NotoSansSC-700.woff2');font-weight:700;font-display:block}
*{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#edf6f4;--card:#fbfdfb;--ink:#123a58;--blue:#1b5574;--red:#b94739;--muted:#48687a;--mint:#dbeae3;--rose:#f1d4cb;--sand:#fff1c9}
html,body,#root{width:1080px;height:1440px;overflow:hidden}
body{background:var(--paper);color:var(--ink);font-family:Course,sans-serif}
#root{position:relative;background:linear-gradient(#123a5813 2px,transparent 2px),linear-gradient(90deg,#123a5813 2px,transparent 2px);background-size:54px 54px}
.stage{position:absolute;left:72px;top:360px;width:936px;height:720px}
#routing-input{position:absolute;left:0;top:0;width:508px;height:240px}
.message{position:absolute;left:0;top:60px;width:352px;height:176px;border:5px solid var(--blue);border-radius:28px 28px 28px 8px;background:var(--card);box-shadow:9px 10px 0 #1b557421}
#message-label{position:absolute;left:25px;top:21px;font-size:20px;letter-spacing:2px;color:var(--blue);font-weight:700;white-space:nowrap}
.message-copy{position:absolute;inset:26px;display:flex;align-items:center;overflow-wrap:anywhere;font-size:31px;line-height:1.45;font-weight:700;opacity:0}
#message1{opacity:1}.fork{position:absolute;left:355px;top:0;width:152px;height:184px;overflow:visible}
.fork path{fill:none;stroke:var(--red);stroke-width:8;stroke-linecap:round}.fork polygon{fill:var(--red)}
.station{position:absolute;left:516px;width:420px;height:196px;border:5px solid var(--ink);box-shadow:7px 8px 0 #1b55741f;opacity:.28}
#routeLog{top:0;background:var(--mint);opacity:1}#routeAfter{top:212px;background:var(--rose)}#routeFin{top:424px;background:var(--sand)}
.person{position:absolute;left:22px;top:22px;width:108px;height:136px}.person .head{position:absolute;left:28px;top:0;width:55px;height:60px;border:4px solid var(--ink);border-radius:50%;background:var(--sand)}.person .body{position:absolute;left:9px;top:54px;width:93px;height:78px;border:4px solid var(--ink);border-radius:45px 45px 8px 8px;background:var(--card)}
.desk{position:absolute;left:142px;top:116px;width:244px;height:22px;border:4px solid var(--ink);background:var(--card)}.desk::before,.desk::after{content:"";position:absolute;top:18px;width:18px;height:23px;border:3px solid var(--ink);border-top:0}.desk::before{left:24px}.desk::after{right:24px}
.screen{position:absolute;left:170px;top:25px;width:102px;height:72px;border:5px solid var(--ink);background:var(--card)}.screen::after{content:"";position:absolute;left:38px;bottom:-18px;width:20px;height:14px;background:var(--ink)}
.object{position:absolute;right:32px;top:28px}.object svg{width:100%;height:100%}
.truck{width:100px;height:66px}.truck .box{position:absolute;left:0;top:5px;width:58px;height:42px;border:4px solid var(--ink);background:var(--mint)}.truck .cab{position:absolute;left:58px;top:17px;width:38px;height:30px;border:4px solid var(--ink);background:var(--sand)}.truck i{position:absolute;top:43px;width:20px;height:20px;border:4px solid var(--ink);border-radius:50%;background:var(--card)}.truck i:first-of-type{left:12px}.truck i:last-of-type{left:68px}
.shirt{width:84px;height:78px;background:var(--rose);border:5px solid var(--ink);clip-path:polygon(18% 0,38% 0,43% 13%,57% 13%,62% 0,82% 0,100% 24%,83% 42%,78% 100%,22% 100%,17% 42%,0 24%)}.shirt::after{content:"";position:absolute;left:36px;top:26px;width:7px;height:34px;background:var(--red);transform:rotate(28deg)}
.calc{width:78px;height:92px;border:5px solid var(--ink);background:var(--card);padding:12px 9px}.calc::before{content:"";display:block;height:17px;background:var(--mint);border:3px solid var(--blue);margin-bottom:9px}.calc::after{content:"•••\A•••";white-space:pre;display:block;color:var(--red);font:700 21px/21px monospace;letter-spacing:7px}
.station b{position:absolute;left:146px;top:154px;font-size:25px;line-height:30px}
#target-focus{position:absolute;left:516px;top:0;width:420px;height:196px;border:5px solid var(--red);box-shadow:9px 10px 0 #b9473938;pointer-events:none}
</style></head><body>
<main id="root" data-composition-id="main" data-start="0" data-duration="4.2" data-width="1080" data-height="1440">
 <div class="stage">
  <div id="routing-input"><span id="message-label">客户消息</span><div class="message"><span class="message-copy" id="message1">帮我查一下快递到哪了</span><span class="message-copy" id="message2">这件衣服破了，想退换</span><span class="message-copy" id="message3">请帮我核对这笔账单</span></div><svg class="fork" viewBox="0 0 152 184" aria-hidden="true"><path d="M4 148C78 148 60 98 142 98"/><polygon points="135,85 152,98 135,111"/></svg></div>
  <div class="station" id="routeLog"><div class="person"><div class="body"></div><div class="head"></div></div><div class="desk"></div><div class="screen"></div><div class="object truck" id="prop1"><div class="box"></div><div class="cab"></div><i></i><i></i></div><b>物流工位</b></div>
  <div class="station" id="routeAfter"><div class="person"><div class="body"></div><div class="head"></div></div><div class="desk"></div><div class="screen"></div><div class="object shirt" id="prop2"></div><b>售后工位</b></div>
  <div class="station" id="routeFin"><div class="person"><div class="body"></div><div class="head"></div></div><div class="desk"></div><div class="screen"></div><div class="object calc" id="prop3"></div><b>财务工位</b></div>
  <div id="target-focus"></div>
 </div>
</main>
<script src="gsap.min.js"></script><script src="settings.js"></script><script src="timeline.js"></script><script>window.__timelines={};window.__timelines.main=tl;</script>
</body></html>

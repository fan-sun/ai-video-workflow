<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><title>list-transfer</title><style>
@font-face{font-family:Course;src:url('fonts/NotoSansSC-400.woff2');font-weight:400;font-display:block}
@font-face{font-family:Course;src:url('fonts/NotoSansSC-700.woff2');font-weight:700;font-display:block}
*{margin:0;padding:0;box-sizing:border-box}
:root{--paper:#f4f1e8;--ink:#2b2c28;--steel:#586b74;--brass:#a9762c;--card:#fdfbf4}
html,body,#root{width:1080px;height:1440px;overflow:hidden}
body{font-family:Course,sans-serif;color:var(--ink);background:var(--paper)}
#root{position:relative;background:radial-gradient(circle at 10% 4%,#586b7426,transparent 30%),radial-gradient(circle at 90% 88%,#a9762c1f,transparent 26%),repeating-linear-gradient(90deg,transparent 0 119px,#2b2c280b 119px 120px)}
.stage{position:absolute;left:64px;top:420px;width:952px;height:650px}
.manual,.machine{position:absolute;top:100px;width:430px;height:420px;border:3px solid var(--ink);background:var(--card);padding:16px 18px}
.manual{left:0}.machine{left:522px;border-color:var(--brass);background:#a9762c12}
.lab{font-size:20px;line-height:1.5;letter-spacing:.06em;color:var(--steel)}
.page{position:absolute;left:20px;width:390px;height:86px;display:flex;align-items:center;gap:16px;padding:0 22px;border:3px solid var(--steel);background:#f7f4ea;font-size:26px;font-weight:700;line-height:1.3;z-index:2}
.page svg{width:78px;height:58px;flex:none}.page span{min-width:0;overflow-wrap:anywhere}
#pg1{top:76px}#pg2{top:176px}#pg3{top:276px}
.intake{position:absolute;left:20px;top:110px;width:390px;height:306px;border:3px dashed var(--brass)}
#result{position:absolute;left:0;top:560px;width:952px;padding:18px 24px;border:3px solid var(--ink);background:var(--card);font-size:29px;font-weight:700;line-height:1.35;opacity:0}
</style></head><body>
<main id="root" data-composition-id="main" data-start="0" data-duration="3.3" data-width="1080" data-height="1440">
 <div class="stage">
  <div class="manual" id="manual"><span class="lab" id="source-label">已有的规则</span><div class="page" id="pg1"><span>流程规范</span></div><div class="page" id="pg2"><span>权限</span></div><div class="page" id="pg3"><span>自动检查</span></div></div>
  <div class="machine" id="machine"><span class="lab" id="target-label">交给系统执行</span><div class="intake"></div></div>
  <div id="result">这些规则，交给系统执行</div>
 </div>
</main>
<script src="gsap.min.js"></script><script src="settings.js"></script><script src="timeline.js"></script><script>window.__timelines={};window.__timelines.main=tl;</script>
</body></html>

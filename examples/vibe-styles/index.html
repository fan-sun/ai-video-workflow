<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>20种视频风格素材库</title>
<style>
:root{color-scheme:dark;--fg:#f2eee5;--muted:#a7b2ba;--line:#33414a;--accent:#ffb86b}*{box-sizing:border-box}body{margin:0;background:#111a21;color:var(--fg);font-family:'Microsoft YaHei',sans-serif}button,a{font:inherit}button{cursor:pointer}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
header{padding:24px 32px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:24px;margin:0 0 7px}header p{font-size:13px;color:var(--muted);margin:0;line-height:1.8}header a{color:var(--accent);font-size:13px;text-decoration:none}
main{display:grid;grid-template-columns:275px minmax(0,1fr);gap:30px;max-width:1640px;margin:auto;padding:24px 32px}nav{max-height:calc(100vh - 160px);overflow:auto;padding-right:8px;display:grid;gap:7px;align-content:start}nav button{display:grid;grid-template-columns:80px 1fr;gap:12px;align-items:center;text-align:left;padding:7px;border:1px solid transparent;border-radius:5px;background:transparent;color:#c4cdd2}nav button:hover{background:#21313d}nav button[aria-pressed=true]{background:#273b48;border-color:#b58b58;color:#fff3d8}nav img{width:80px;aspect-ratio:16/9;object-fit:cover;border-radius:3px;background:#1c2d38}nav small{display:block;color:#8ca0ad;font:11px monospace;margin-bottom:6px}nav strong{font-size:13px;font-weight:500;line-height:1.5}
.screen{width:100%;aspect-ratio:16/10;max-height:72vh;background:#080e13;border:1px solid var(--line);border-radius:6px;overflow:hidden;position:relative}iframe{display:block;border:0;width:100%;height:100%}.loading{position:absolute;inset:0;display:grid;place-items:center;background:#101c27;z-index:2;color:#c1ced5}.loading[hidden]{display:none}.caption{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:20px 0 12px}h2{margin:0;font-size:24px}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button,.actions a{padding:9px 14px;border:1px solid #465e6d;border-radius:4px;background:transparent;color:var(--fg);font-size:13px;text-decoration:none}.actions button:hover,.actions a:hover{background:#273b48}#desc{color:#bdc9cf;font-size:15px;line-height:1.9;margin:12px 0}#tags{display:flex;gap:10px;flex-wrap:wrap}#tags span{font-size:12px;color:#dbc19a;padding:7px 10px;background:#25333d;border-radius:3px}.note{border-top:1px solid var(--line);padding-top:15px;margin-top:25px;color:var(--muted);font-size:12px;line-height:1.9}#status{color:var(--accent);font-size:12px}
@media(max-width:800px){header{padding:20px}header>a{display:none}main{grid-template-columns:1fr;padding:16px;gap:14px}nav{max-height:180px;grid-template-columns:repeat(2,minmax(0,1fr));padding:0}nav button{grid-template-columns:54px 1fr;gap:8px}nav img{width:54px}nav strong{font-size:12px}.caption{align-items:flex-start;flex-direction:column}h2{font-size:21px}.screen{max-height:none}header p{font-size:12px}}
</style><script src="/ref/comp/meta.js"></script></head><body>
<header><div><h1>原版 20 种视频风格</h1><p>20种完整场景已保存在本项目，可查看画面、材质与运镜并复用源码。</p></div><a href="README.md" target="_blank" rel="noopener">使用说明 ↗</a></header>
<main><nav aria-label="20种风格"></nav><section><div class="screen"><div class="loading" id="loading">正在准备原版画面…</div><iframe id="player" title="原版风格预览" allow="autoplay; fullscreen" allowfullscreen></iframe></div>
<div class="caption"><h2 id="title"></h2><div class="actions"><button id="prev">上一种</button><button id="next">下一种</button><button id="restart">重新播放</button><a id="rendered" hidden target="_blank" rel="noopener">查看已渲染MP4 ↗</a><a id="open" target="_blank" rel="noopener">单独打开 ↗</a></div></div>
<p id="desc"></p><div id="tags"></div><p id="status" aria-live="polite"></p>
<p class="note">这是原版实时动画，可在画面底部暂停、拖动进度。实时预览不包含导出时合成的配乐和多子帧运动模糊。<br>一次只运行当前一项；三维与液态风格较吃显卡，第19项黏土定格首次初始化较慢。若嵌入画面显示异常，可点击“单独打开”。</p>
</section></main><script src="/player.js"></script></body></html>
